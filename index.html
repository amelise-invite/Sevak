/* =====================================================
   ROOT
====================================================== */

:root{
    --ink:#111;
    --accent:#b8643a;
    --green:#a3a947;
    --sage:#d6dcae;
    --sand:#f6dfb4;
    --bg:#fff;
}


/* =====================================================
   RESET
====================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    background:var(--bg);
    color:var(--ink);

    font-family:
        'Noto Sans Armenian',
        Arial,
        sans-serif;

    overflow-x:hidden;

    padding-bottom:
        env(safe-area-inset-bottom);
}


img{
    display:block;
    max-width:100%;
}


/* =====================================================
   DECORATIONS
====================================================== */

.deco{
    position:absolute;

    pointer-events:none;

    opacity:.9;
}


/* =====================================================
   HERO
====================================================== */

.hero{

    position:relative;

    min-height:100vh;

    display:grid;

    grid-template-columns:1fr 1fr;

    align-items:center;

    padding:
        60px
        4vw
        20px;

    gap:2vw;
}


/* =====================================================
   FIRST PHOTO
====================================================== */

.tooth-wrap{

    position:relative;

    justify-self:center;

    width:min(34vw,500px);

    margin-top:70px;
}


.tooth-photo{

    width:100%;

    aspect-ratio:577/640;

    object-fit:cover;

    clip-path:url(#toothClip);
}


/* =====================================================
   CURVED TEXT
====================================================== */

.arc{

    position:absolute;

    top:-70px;

    left:30%;

    width:75%;

    overflow:visible;
}


.arc text{

    font-size:46px;

    font-weight:300;

    fill:var(--ink);
}


/* =====================================================
   SECOND PHOTO
====================================================== */

.seven-wrap{

    position:relative;

    justify-self:center;

    width:min(36vw,540px);

    margin-top:50px;

    text-align:center;
}


.seven-photo{

    width:88%;

    aspect-ratio:1/1.15;

    object-fit:cover;

    object-position:var(--pos,60% 85%);

    display:block;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 20%,
            62% 100%,
            16% 100%,
            58% 36%,
            0 36%
        );
}


/* =====================================================
   7 MONTHS
====================================================== */

.vertical{

    position:absolute;

    right:0;

    top:34%;

    writing-mode:vertical-rl;

    font-size:
        clamp(24px,2.8vw,44px);

    font-weight:300;

    letter-spacing:2px;

    white-space:nowrap;
}


/* =====================================================
   NAME
====================================================== */

    font-weight:300;

    letter-spacing:6px;

    margin-top:18px;

/* =====================================================

/* =====================================================
   MUSIC BUTTON
====================================================== */

#musicBtn{

    position:fixed;

    right:24px;

    bottom:
        calc(
            24px +
            env(safe-area-inset-bottom)
        );

    width:68px;

    height:68px;

    border-radius:50%;

    border:1px solid #ddd;

    background:#fff;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    cursor:pointer;

    display:grid;

    place-items:center;

    z-index:50;
}


#musicBtn span{

    width:52px;

    height:52px;

    border-radius:50%;

    background:#111;

    display:grid;

    place-items:center;
}


#musicBtn svg{

    width:26px;

    height:26px;

    fill:#fff;
}


#musicBtn.playing span{

    animation:
        pulse 1.6s infinite;
}


@keyframes pulse{

    0%,
    100%{
        transform:scale(1);
    }

<button
    id="musicBtn"
    aria-label="Երաժշտություն"
    type="button"
>

    <span>


        <!-- MUSIC ON -->

        <svg
            id="icoOn"
            viewBox="0 0 24 24"
        >

            <path
                d="
                M3 9v6h4l5 5V4L7 9H3zm13.5 3
                a4.5 4.5 0 0 0-2.5-4v8
                a4.5 4.5 0 0 0 2.5-4z
                M14 3.2v2.1
                a7 7 0 0 1 0 13.4v2.1
                a9 9 0 0 0 0-17.6z
                "
            />

        </svg>



        <!-- MUSIC OFF -->

        <svg
            id="icoOff"
            viewBox="0 0 24 24"
            style="display:none"
        >

            <path
                d="
                M16.5 12
                a4.5 4.5 0 0 0-2.5-4v2.2l2.5 2.5z
                M19 12
                a7 7 0 0 1-.9 3.4l1.5 1.5
                A9 9 0 0 0 21 12
                a9 9 0 0 0-7-8.8v2.1
                A7 7 0 0 1 19 12z
                M4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7
                l4.3 4.3
                c-.7.5-1.4.9-2.3 1.1v2.1
                a9 9 0 0 0 3.7-1.8l2 2
                1.3-1.3L4.3 3z
                M12 4L9.9 6.1 12 8.2V4z
                "
            />

        </svg>

    </span>

</button>



<script>

/* =====================================================
   BACKGROUND MUSIC
====================================================== */

(function(){

    var audio =
        document.getElementById('bgm');

    var btn =
        document.getElementById('musicBtn');

    var on =
        document.getElementById('icoOn');

    var off =
        document.getElementById('icoOff');


    var userPaused = false;


    audio.volume = 0.7;


    function updateMusicUI(playing){

        btn.classList.toggle(
            'playing',
            playing
        );


        on.style.display =
            playing ? '' : 'none';


        off.style.display =
            playing ? 'none' : '';

    }


    function startMusic(){

        if(userPaused){
            return;
        }


        var promise =
            audio.play();


        if(
            promise &&
            promise.then
        ){

            promise
                .then(function(){

                    updateMusicUI(true);

                    removeUnlockListeners();

                })
                .catch(function(){

                    /*
                     Browser-ը կարող է
                     autoplay-ը արգելել։
                    */

                    updateMusicUI(false);

                });

        }

    }


    var events = [
        'click',
        'touchstart',
        'keydown',
        'scroll',
        'mousemove'
    ];


    function unlockMusic(){

        startMusic();

    }


    function removeUnlockListeners(){

        events.forEach(
            function(event){

                window.removeEventListener(
                    event,
                    unlockMusic
                );

            }
        );

    }


    events.forEach(
        function(event){

            window.addEventListener(
                event,
                unlockMusic,
                {
                    passive:true
                }
            );

        }
    );


    window.addEventListener(
        'load',
        startMusic
    );


    startMusic();


    btn.addEventListener(
        'click',
        function(event){

            event.stopPropagation();


            if(audio.paused){

                userPaused = false;


                audio
                    .play()
                    .then(function(){

                        updateMusicUI(true);

                    })
                    .catch(function(){

                        updateMusicUI(false);

                    });

            }

            else{

                userPaused = true;

                audio.pause();

                updateMusicUI(false);

            }

        }
    );


    updateMusicUI(false);

})();

</script>
